name: Generate AllAnime Keys

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour automatically
  workflow_dispatch: # Allows you to click "Run" manually from the GitHub website

permissions:
  contents: write # Needed to commit and push keygen.json

jobs:
  extract_keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install requests playwright pycryptodome
          playwright install --with-deps chromium

      - name: Run Keygen Script
        run: python keygen_node.py

      - name: Commit and Push new Keys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add keygen.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AllAnime keys" && git push)
